[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-game-npcs"
version = "0.1.0"
description = "Persistent, grounded dialogue and constrained decisions for game NPCs"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
npc-demo = "npc_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
